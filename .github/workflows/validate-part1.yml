name: RaceDay Part 1 Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required Part 1 files
        shell: bash
        run: |
          test -d docs
          test -f docs/RaceDay_ERD.md
          test -f docs/RaceDay_API_Endpoint_Plan.md
          test -f docs/RaceDay_Database.sql
          test -f README.md
          echo "RaceDay Part 1 structure validated successfully."
